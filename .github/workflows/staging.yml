name: Deploy to Staging

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

# Electron's postinstall downloads a ~100 MB binary from GitHub releases. NOTHING in this
# workflow uses it — lint is oxlint, typecheck is `tsc --noEmit`, test is vitest, build is the
# web vite build, and the e2e job drives Playwright CHROMIUM, not Electron. Downloading it in
# every job was pure waste AND a permanent transient-failure surface: on 2026-07-14 `bun install --frozen-lockfile
# died with `TypeError: fetch failed` mid-download and took Type Check red on main with it.
#
# Do NOT set this in cross-platform.yml / build-desktop.yml — those genuinely launch Electron
# and package installers, and need the real binary.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: bun run test

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: lint-and-test
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    outputs:
      # These were NEVER declared, yet e2e-staging consumes
      # `needs.deploy-preview.outputs.url` as its BASE_URL — so BASE_URL was always the
      # empty string and the staging E2E could not have worked even on a successful deploy.
      # It only ever *looked* fine because this job failed first (missing Cloudflare creds),
      # which skipped e2e-staging entirely.
      url: ${{ steps.deploy.outputs.deployment-url }}
      deployed: ${{ steps.cf.outputs.configured }}
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}

      # Same story as deploy.yml: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID have never been
      # set on this repo, so `Deploy Preview` failed on EVERY run. A permanently-red check is
      # noise, not a signal — it trains people to skim past red, which is how this repo's real
      # failures went unnoticed. Skip loudly instead of failing; the build above still gates.
      # Resumes automatically once the secrets exist.
      # (Secrets are unavailable in a job-level `if:`, hence the step-output guard.)
      - name: Check Cloudflare credentials
        id: cf
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare preview deploy SKIPPED::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set on this repository, so the preview deploy was skipped. The build itself succeeded."
          fi

      # The branch name reaches a SHELL COMMAND here, which it did not under the previous
      # action: `cloudflare/pages-action` took `branch:` as a structured input, while
      # `wrangler-action` takes a `command:` string. So `${ github.head_ref }` -- the PR
      # author's branch name, and attacker-controlled on a fork PR -- would be interpolated
      # into shell text. A branch called `x";curl ...|sh;"` is a command injection.
      #
      # Two defences, not one. The raw value arrives as an ENVIRONMENT VARIABLE, so it cannot
      # reach this script as code whatever it contains; and it is then checked against an
      # ALLOWLIST, so the value that does get interpolated below is proven to hold only
      # characters that are inert in a shell. The check FAILS THE JOB rather than sanitising
      # quietly: a deploy to a silently-renamed branch is its own bug.
      - name: Resolve and validate the deploy branch
        id: branch
        if: steps.cf.outputs.configured == 'true'
        env:
          RAW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$RAW_BRANCH" in
            "" | -* | *..* | *[!A-Za-z0-9._/-]*)
              echo "::error title=Refusing to deploy::Branch name is empty, starts with '-', contains '..', or holds a character outside [A-Za-z0-9._/-]. Refusing rather than sanitising." >&2
              exit 1
              ;;
          esac
          printf 'name=%s\n' "$RAW_BRANCH" >> "$GITHUB_OUTPUT"

      # cloudflare/pages-action@v1 WAS HERE AND THE UPSTREAM ACTION HAS BEEN DELETED --
      # `gh api repos/cloudflare/pages-action` returns 404. That failed this job at SETUP on
      # 2026-10-02, because GitHub resolves every `uses:` BEFORE any step `if:` is evaluated, so
      # the credential guard above could not prevent it. A step-level guard cannot protect a bad
      # `uses:`.
      #
      # The replacement takes the project name, output directory and branch as WRANGLER ARGUMENTS
      # rather than as action inputs, and renames its outputs: `url` became `deployment-url`.
      # Every consumer in this file was renamed with it -- an unresolved `${{ }}` expression
      # renders as an EMPTY STRING, never an error, so a half-done rename would have produced a
      # blank deployment URL that still looked like a success.
      #
      # NOT VERIFIED AGAINST A REAL DEPLOY: this repository has no CLOUDFLARE_API_TOKEN or
      # CLOUDFLARE_ACCOUNT_ID at any scope, so the guard above is false and this step skips. It is
      # written to be correct for the day those secrets exist.
      - name: Deploy to Cloudflare Pages (Preview)
        id: deploy
        if: steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: bun
          command: >-
            pages deploy dist --project-name=paperflow
            --branch=${{ steps.branch.outputs.name }}

      - name: Comment on PR
        # NOTE: this step already had an `if:`. Both conditions must be ANDed into ONE key —
        # a duplicate `if:` is accepted silently by PyYAML (last wins) but REJECTED by GitHub
        # with a bare "This run likely failed because of a workflow file issue."
        if: github.event_name == 'pull_request' && steps.cf.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Preview Deployment

              Your changes have been deployed to a preview environment:

              **URL:** ${{ steps.deploy.outputs.deployment-url }}

              This preview will be automatically updated with new commits to this PR.`
            })

  e2e-staging:
    name: E2E Tests (Staging)
    runs-on: ubuntu-latest
    needs: deploy-preview
    # Only run when a preview was ACTUALLY deployed. Without the Cloudflare creds the
    # deploy is skipped, so there is no URL to test — running anyway just fails on an empty
    # BASE_URL, which is noise, not a signal.
    if: needs.deploy-preview.outputs.deployed == 'true'
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests against staging
        run: bun run test:e2e
        env:
          BASE_URL: ${{ needs.deploy-preview.outputs.url }}
