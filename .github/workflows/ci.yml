name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  # REQUIRED: deploy.yml calls this workflow with `uses: ./.github/workflows/ci.yml`.
  # A reusable-workflow call is INVALID unless the callee declares `workflow_call`, and
  # GitHub rejects the *entire calling file* when it isn't — so deploy.yml produced
  # ZERO JOBS on every run since it was written, reporting only:
  #     "This run likely failed because of a workflow file issue."
  # No job list, no logs. It never reached the Cloudflare deploy step at all; the long-
  # standing "deploy is blocked on a missing Cloudflare secret" diagnosis was wrong.
  # The tell for this class of failure is `jobs == 0` on the run.
  workflow_call:

# Electron 42+ does not download its binary during `bun install`. The binary is
# fetched the first time the `electron` module is loaded. Nothing in this workflow
# loads it (lint, typecheck, vitest, the web Vite build, Playwright Chromium).
# Desktop packaging workflows download Electron through electron-builder's
# `@electron/get`. `ELECTRON_SKIP_BINARY_DOWNLOAD` was removed by Electron 42;
# do not set it.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript
        run: npx tsc --noEmit

  test:
    name: Unit & Integration Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    # E2E needs a live dev server and a Playwright browser. Run it only on
    # demand via manual workflow_dispatch so it neither gates PRs nor reds the
    # main-branch CI, while remaining runnable when someone wants the coverage.
    # Only chromium is installed below, so the run is limited to that project.
    # (Not a security gate; the Security Audit job is unchanged.)
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Run E2E tests
        run: bun run test:e2e --project=chromium

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    needs: build
    # Lighthouse needs a live server + headless browser and currently fails the
    # PWA minScore assertion (content-dependent, not a code regression). Same
    # treatment as e2e: manual workflow_dispatch only, so it does not gate PRs
    # or red the main-branch CI. (Not a security gate.)
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `continue-on-error: true` was set on BOTH steps, which made this job report success no
      # matter what — a check that cannot fail asserts nothing (CI anti-pattern #1). Removed only
      # after verifying the gate passes TODAY: `bun audit --audit-level=high` exits 0 with
      # 0 vulnerabilities. Turning a gate on without checking first just trades a fake-green
      # pipeline for a permanently-red one.
      #
      # This job is deliberately NOT a required check, so a new advisory shows up as an honest red
      # signal without blocking every merge — which is what you want when the fix isn't available yet.
      # ONE audit step, not two. `npx better-npm-audit` wrapped `npm audit`, which
      # requires a package-lock.json the Bun migration deleted -- it failed with
      # `npm error code ENOLOCK` on every run, which is a permanently-red check, not a
      # security signal. bun audit covers the same advisory database.
      #
      # NO --ignore FLAG. The gate asserts the real state of the tree.
      #
      # This step used to carry --ignore=GHSA-qwww-vcr4-c8h2, the react-router RSC-mode
      # CSRF bypass inherited from the .nsprc allowlist better-npm-audit read. That
      # comment set its own expiry -- "RE-REVIEW when moving to react-router 8.x" -- and
      # the condition has fired: the dependency is react-router ^8.3.0 and the advisory
      # no longer appears at ANY level, so the exception had become dead config whose
      # only remaining effect was to hide a future advisory that happened to share the ID.
      # An exception outlives its premise silently; this one is removed rather than
      # re-justified. Restore an --ignore only with a reachability argument written at
      # the time, not inherited.
      - name: Run bun audit
        run: bun audit --audit-level=high

  doc-gates:
    name: Doc Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # Both gates read the source and the generated reports; neither needs the dependency install.
      # The version is pinned. A new repo-tools release can change a count (2.2.3 did, by reading .tsx files
      # with the TSX grammar), so a bump is a deliberate change that regenerates docs/architecture in the same PR.
      - name: Install repo-tools
        run: npm install --global @danielsimonjr/repo-tools@2.2.3

      - name: Architecture docs gate
        run: repo-tools check . --docs=docs/architecture

      - name: Code docs gate
        run: repo-tools docs check src
